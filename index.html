<style>
  :root{
    --bg:#f5f3ee; --card:#ffffff; --ink:#2b2a26; --muted:#716d63; --line:#e4e0d6;
    --accent:#3d6b57; --accent-dark:#315846; --right:#2e7d4f; --wrong:#b3402f;
    --warn:#a9792b; --chip:#efede6; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",system-ui,sans-serif;
    font-size:17px; line-height:1.75; padding-bottom:48px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:0 16px;}
  header.top{
    position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .top-inner{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:860px;margin:0 auto;position:relative;}
  .top-inner h1{font-size:19px;font-weight:700;flex:1;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;
    font-size:15px;cursor:pointer;text-decoration:none;line-height:1.3;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.small{padding:6px 10px;font-size:14px;border-radius:8px;}
  .btn.ghost{background:transparent;}
  .sync-badge{
    flex-shrink:0;display:inline-flex;align-items:center;gap:4px;
    font-size:12px;line-height:1.4;padding:3px 9px;border-radius:8px;white-space:nowrap;
  }
  .sync-badge.synced{color:var(--right);background:#eef6f0;border:1px solid #cfe5d5;}
  .sync-badge.syncing{color:var(--muted);background:var(--chip);border:1px solid var(--line);}
  .sync-badge.local{color:var(--warn);background:#fbf4e4;border:1px solid #e6d3a8;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin:14px 0;
  }
  .muted{color:var(--muted);}
  .goal{font-size:16px;color:var(--accent-dark);background:#f0f5f1;border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;}
  .stats-line{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:15px;color:var(--muted);margin:10px 0;}
  .stats-line b{color:var(--ink);}
  .chip{display:inline-block;background:var(--chip);border-radius:8px;padding:2px 10px;font-size:14px;}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:1px 9px;font-size:13px;margin-right:6px;}
  .tag.theory{color:#5a574f;border-color:#d8d4c8;background:#f6f4ee;}
  .tag.practice{color:var(--warn);border-color:#e6d3a8;background:#fbf4e4;}
  .src{display:inline-block;border-radius:7px;padding:1px 9px;font-size:13px;}
  .src.s-orig{background:#eaf3ec;color:var(--right);border:1px solid #cfe5d5;}
  .src.s-none{background:#f0efeb;color:var(--muted);border:1px solid var(--line);}
  .src.s-gen{background:#fbf4e4;color:var(--warn);border:1px solid #e6d3a8;}
  .src.s-src-orig{background:#eaf3ec;color:var(--right);border:1px solid #cfe5d5;}
  .src.s-src-rewrite{background:#fbf4e4;color:var(--warn);border:1px solid #e6d3a8;}
  .src.s-src-gen{background:#efede6;color:#5a574f;border:1px solid #d8d4c8;}
  /* chapter list */
  .ch-item{display:block;text-decoration:none;color:var(--ink);}
  .ch-item.locked{opacity:.55;cursor:not-allowed;}
  .ch-item .ch-head{display:flex;align-items:baseline;gap:10px;}
  .ch-item .ch-name{font-size:17px;font-weight:700;}
  .status{font-size:14px;margin-left:auto;white-space:nowrap;}
  .status.pass{color:var(--right);}
  .status.lock{color:var(--muted);}
  .status.doing{color:var(--warn);}
  .ch-goal{font-size:14px;color:var(--muted);margin-top:4px;}
  .ch-meta{font-size:14px;color:var(--muted);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;}
  /* mode selector */
  .modes{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;}
  .mode-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:15px;}
  .mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .sec-list{display:flex;flex-direction:column;gap:10px;}
  .sec-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;}
  .sec-item .sec-name{flex:1;}
  .sec-item.sec-skip{opacity:.5;cursor:not-allowed;}
  .sec-item .sec-count{font-size:14px;color:var(--muted);white-space:nowrap;}
  /* question card */
  .q-tags{margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .stem{font-size:18px;font-weight:600;margin:8px 0 16px;}
  .context-box{background:#f6f7f9;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 13px;margin:8px 0 14px;font-size:15px;color:#3a3832;line-height:1.7;}
  .context-box .ctx-label{font-size:13px;font-weight:700;color:var(--accent-dark);margin-bottom:5px;}
  .context-box .ctx-body{white-space:pre-wrap;}
  .opts{display:flex;flex-direction:column;gap:12px;}
  .opt{
    display:flex;gap:10px;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;font-size:16px;
    min-height:44px;
  }
  .opt .k{font-weight:700;color:var(--accent-dark);min-width:22px;}
  .opt:hover{border-color:var(--accent);}
  .opt.correct{border-color:var(--right);background:#eef6f0;}
  .opt.correct .k{color:var(--right);}
  .opt.wrong{border-color:var(--wrong);background:#fbeeec;}
  .opt.wrong .k{color:var(--wrong);}
  .opt.disabled{cursor:default;}
  .opt.disabled:hover{border-color:var(--line);}
  .opt.selected{border-color:var(--accent);}
  .verdict{margin:14px 0 0;font-weight:700;font-size:16px;}
  .verdict.right{color:var(--right);}
  .verdict.wrong{color:var(--wrong);}
  .panel{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;}
  .hook{background:#fbf4e4;border-left:3px solid var(--warn);padding:9px 13px;border-radius:0 10px 10px 0;font-size:15px;margin-bottom:12px;color:#6b531f;}
  .ans{font-weight:600;margin-bottom:8px;}
  .ana{color:#3a3832;}
  .kp-ref{margin-top:10px;font-size:14px;color:var(--muted);}
  .self-btns{display:flex;gap:12px;margin-top:8px;}
  .quiz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;}
  .progress{font-size:14px;color:var(--muted);}
  .summary{text-align:center;padding:24px 0;}
  .summary .big{font-size:22px;font-weight:700;margin:10px 0;}
  .note{font-size:14px;color:var(--warn);margin-top:8px;}
  .toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;}
  input[type=file]{display:none;}
  .empty{text-align:center;color:var(--muted);padding:36px 0;}
  .pill{display:inline-block;border-radius:7px;padding:1px 9px;font-size:13px;white-space:nowrap;}
  .pill.not_started{color:var(--muted);background:var(--chip);}
  .pill.reading{color:#2f5d8a;background:#eaf2f8;}
  .pill.ready{color:var(--warn);background:#fbf4e4;}
  .pill.done{color:var(--right);background:#eef6f0;}
  .pill.review{color:var(--wrong);background:#fbeeec;}
  .today-bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0;}
  .today-bar i{display:block;height:100%;background:var(--accent);border-radius:6px;}
  .group-head{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:700;font-size:16px;}
  .group-head .collapse-btn{margin-left:auto;}
  .done-list{display:flex;flex-direction:column;gap:10px;}
  .done-list.collapsed{display:none;}
  /* v8：R1 已完成（青色，与金色「已通关」严格区分） */
  .ch-item.r1-done{background:#e8f5f2;border-color:#9fd8d0;}
  .ch-item.r1-done .ch-name{color:#0f766e;}
  .ch-item.r1-done .ch-meta{color:#0f766e;}
  .chip.r1-chip{background:#d2efe9;color:#0f766e;border:1px solid #9fd8d0;}
  .sec-item.r1-sec{background:#e8f5f2;border-color:#9fd8d0;}
  .sec-item.r1-sec .sec-name{color:#0f766e;}
  .sec-item .sec-done{color:#0f766e;font-weight:700;}
  /* 头部菜单 */
  .top-row{display:flex;align-items:center;gap:10px;}
  .top-row1{flex:1;}
  .menu-btn{display:none;}
  /* 诊断面板 */
  .diag-panel{position:fixed;left:10px;right:10px;bottom:10px;max-width:860px;margin:0 auto;
    background:#1f2421;color:#e8e6dd;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.7;
    white-space:pre-wrap;word-break:break-word;z-index:50;max-height:45vh;overflow:auto;}
  .diag-panel h2{font-size:13px;margin-bottom:6px;}
  @media (max-width:560px){
    body{overflow-x:hidden;font-size:16px;}
    .stem{font-size:17px;word-break:break-word;}
    .context-box{word-break:break-word;}
    .ch-name{word-break:break-word;}
    .top-inner{flex-direction:column;gap:8px;padding:10px 12px;}
    .top-row1{width:100%;}
    .top-inner h1{font-size:17px;flex:1;white-space:nowrap;overflow:hidden;}
    .btn{padding:8px 11px;font-size:14px;}
    .menu-btn{display:inline-flex;}
    .top-row2{
      display:none;position:absolute;top:calc(100% + 6px);right:12px;flex-direction:column;gap:8px;
      background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
      z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.14);min-width:140px;
    }
    .top-row2.open{display:flex;}
    .opts{gap:10px;}
    .opt{font-size:16px;min-height:44px;}
  }
</style>
</head>

<header class="top">
  <div class="top-inner">
    <div class="top-row top-row1">
      <h1 id="top-title">刷题机 <span style="font-size:13px;color:var(--muted)">v8</span></h1>
      <span class="sync-badge syncing" id="sync-badge" title="进度同步状态">⟳ 加载中</span>

        <input type="checkbox" id="debug-unlock"> 调试解锁
      </label>
      <input type="file" id="import-file" accept="application/json,.json">
    </div>
  </div>
</header>

var COV_DONE=0.80;
var TODAY_GOAL=25;
var SPACING=[1,3,7];
var CACHE_PREFIX="cpa_ch_";
var CACHE_MAX=3;
var CACHE_BUDGET=2.5*1024*1024;

/* ---------- 工具（纯 ES5，不依赖现代 API） ---------- */
function assign(a,b){
  var out={},k;
  for(k in a){if(Object.prototype.hasOwnProperty.call(a,k))out[k]=a[k];}
  for(k in b){if(Object.prototype.hasOwnProperty.call(b,k))out[k]=b[k];}
  return out;
}
function esc(t){
  return String(t==null?"":t).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pad2(n){return n<10?"0"+n:""+n;}

/* ---------- 数据层：轻量版只有 INDEX；离线版全量 DATA ---------- */
var loaded={};  // ch -> {knowledge:{}, questions:[]}
function initData(){
  if(window.DATA&&window.DATA.questions&&window.DATA.questions.length!==undefined){
    var qs=window.DATA.questions,kp=window.DATA.knowledge||{};
    var byCh={},i,q,kk;
    for(i=0;i<qs.length;i++){q=qs[i];if(!byCh[q.ch])byCh[q.ch]={knowledge:{},questions:[]};byCh[q.ch].questions.push(q);}
    for(kk in kp){if(!Object.prototype.hasOwnProperty.call(kp,kk))continue;var k=kp[kk];if(!byCh[k.ch])byCh[k.ch]={knowledge:{},questions:[]};byCh[k.ch].knowledge[kk]=k;}
    loaded=byCh;
  }else if(window.INDEX&&window.INDEX.chapters){
    window.DATA={chapters:window.INDEX.chapters,knowledge:{},questions:[]};
  }else{
    window.DATA={chapters:[],knowledge:{},questions:[]};
  }
}
function metaOf(ch){
  var arr=window.DATA.chapters;
  for(var i=0;i<arr.length;i++){if(arr[i].ch===ch)return arr[i];}
  return null;
}
function questionsOf(ch){
  var d=loaded[ch];
  if(d&&d.questions)return d.questions;
  var cached=readCache(ch);
  if(cached&&cached.questions)return cached.questions;
  return [];
}
function kpOf(q){var d=loaded[q.ch];return d&&d.knowledge?d.knowledge[q.topic]||null:null;}
function chOfQid(qid){var m=/^CH(\d+)-/.exec(qid||"");return m?parseInt(m[1],10):null;}
function sectionOf(q){return q.section_norm||q.section||"";}

/* ---------- 本地状态 ---------- */
function defaultState(){return {attempts:{},chapterPass:{},debugUnlock:false,mode:"R1"};}
function migrateAttempts(att){
  var now=Date.now();
  Object.keys(att).forEach(function(k){
    var a=att[k];
    if(typeof a!=="object")return;
    if(typeof a.inWrong!=="boolean"){a.inWrong=(a.verdict==="wrong");}
    if(typeof a.consecRight!=="number"){a.consecRight=0;}
    if(typeof a.lastTs!=="number"){a.lastTs=now;}
    if(typeof a.rightCount!=="number"){a.rightCount=(a.verdict==="right"?1:0);}
    if(typeof a.wrongCount!=="number"){a.wrongCount=(a.verdict==="wrong"?1:0);}
    if(typeof a.cleared!=="boolean"){a.cleared=false;}
  });
  return att;
}
function migrateState(s){
  if(!s||typeof s!=="object")return defaultState();
  if(typeof s.attempts!=="object"||!s.attempts)s.attempts={};
  s.attempts=migrateAttempts(s.attempts);
  if(typeof s.chapterPass!=="object"||!s.chapterPass)s.chapterPass={};
  return assign(defaultState(),s);
}
function loadState(){
  try{
    var s=JSON.parse(localStorage.getItem(LS_KEY));
    if(s&&typeof s.attempts==="object"){return migrateState(s);}
  }catch(e){}
  return defaultState();
}
function saveState(){localStorage.setItem(LS_KEY,JSON.stringify(state));}
var state=loadState();
var view={screen:"home",ch:null,mode:"R1",section:null,queue:[],idx:0,autoStart:false};
var doneCollapsed=true;

/* ---------- 统计 / 状态机 ---------- */
function planOrder(c){return (c&&typeof c.plan_order==="number")?c.plan_order:c.ch;}
function stats(ch){
  var meta=metaOf(ch);
  var total=(meta&&typeof meta.q_count==="number")?meta.q_count:questionsOf(ch).length;
  var answered=0,right=0;
  for(var k in state.attempts){
    if(!Object.prototype.hasOwnProperty.call(state.attempts,k))continue;
    if(chOfQid(k)!==ch)continue;
    var a=state.attempts[k];
    if(a&&(a.verdict==="right"||a.verdict==="wrong")){
      answered++;
      if(a.verdict==="right")right++;
    }
  }
  var inWrongCount=0;
  for(var k2 in state.attempts){
    if(!Object.prototype.hasOwnProperty.call(state.attempts,k2))continue;
    if(chOfQid(k2)!==ch)continue;
    var a2=state.attempts[k2];
    if(a2&&a2.inWrong&&!a2.cleared)inWrongCount++;
  }
  var accuracy=answered?right/answered:null;
  var coverage=total>0?answered/total:0;
  var pass=!!(state.chapterPass&&state.chapterPass[ch]);
  return {total:total,answered:answered,right:right,wrong:inWrongCount,accuracy:accuracy,coverage:coverage,pass:pass,passed:pass};
}
function isDueAttempt(a){return !!a&&a.inWrong&&!a.cleared&&typeof a.dueAt==="number"&&a.dueAt<=Date.now();}
/* v8：R1「每题都答过」判定。只读当前已加载章的题目集合，未加载不额外 fetch；每次渲染即时重算，不做缓存。 */
function r1Done(ch){
  var qs=questionsOf(ch);
  if(qs.length===0)return false;
  for(var i=0;i<qs.length;i++){
    if(!state.attempts[qs[i].qid])return false;
  }
  return true;
}
function r1SecAnswered(ch,sec){
  var n=0,qs=questionsOf(ch);
  for(var i=0;i<qs.length;i++){
    if(sectionOf(qs[i])===sec&&state.attempts[qs[i].qid])n++;
  }
  return n;
}
function r1SecDone(ch,sec){
  var qs=questionsOf(ch),total=0,ans=0;
  for(var i=0;i<qs.length;i++){
    if(sectionOf(qs[i])===sec){total++;if(state.attempts[qs[i].qid])ans++;}
  }
  return total>0&&ans===total;
}
function dueWrongOfChapter(ch){
  var n=0;
  for(var k in state.attempts){
    if(!Object.prototype.hasOwnProperty.call(state.attempts,k))continue;
    var a=state.attempts[k];
    if(a&&chOfQid(k)===ch&&isDueAttempt(a))n++;
  }
  return n;
}
function dueWrongAll(){
  var n=0;
  for(var k in state.attempts){if(isDueAttempt(state.attempts[k]))n++;}
  return n;
}
function todayAnswered(){
  var now=new Date();
  var day=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  var n=0;
  for(var k in state.attempts){
    var a=state.attempts[k];
    if(a&&typeof a.lastTs==="number"){
      var d=new Date(a.lastTs);
      if(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()===day)n++;
    }
  }
  return n;
}
function chapterState(ch){
  var s=stats(ch);
  if(s.answered===0)return "not_started";
  if(s.pass&&s.coverage>=COV_DONE)return dueWrongOfChapter(ch)>0?"review":"done";
  if(s.coverage>=COV_READING)return "ready";
  return "reading";
}
var STATE_LABEL={not_started:"未开始",reading:"在读",ready:"待通关",done:"已完成",review:"待复习"};
function sortedChapters(){
  return window.DATA.chapters.slice().sort(function(a,b){
    var oa=planOrder(a),ob=planOrder(b);
    return oa===ob?a.ch-b.ch:oa-ob;
  });
}
function nextIncomplete(ch){
  var arr=sortedChapters();
  var idx=-1,i,j;
  for(i=0;i<arr.length;i++)if(arr[i].ch===ch)idx=i;
  for(j=idx+1;j<arr.length;j++)if(!(state.chapterPass&&state.chapterPass[arr[j].ch]))return arr[j];
  for(j=0;j<idx;j++)if(!(state.chapterPass&&state.chapterPass[arr[j].ch]))return arr[j];
  return null;
}
function isLocked(ch){
  if(ch<=1)return false;
  if(state.debugUnlock)return false;
  var prev=stats(ch-1);
  if(prev.total===0)return false;
  return !prev.pass;
}
function wrongOf(ch){
  return questionsOf(ch).filter(function(q){var a=state.attempts[q.qid];return a&&a.inWrong&&!a.cleared;});
}
function chapterSections(c){
  if(c&&c.sections&&c.sections.length)return c.sections;
  var d=loaded[view.ch];
  if(d&&d.sections&&d.sections.length)return d.sections;
  var out=[],seen={};
  questionsOf(view.ch).forEach(function(q){
    var n=sectionOf(q)||"未分节";
    if(!seen[n]){seen[n]=1;out.push({n:n,q:1,skip:0});}
    else{for(var i=0;i<out.length;i++){if(out[i].n===n){out[i].q++;break;}}}
  });
  return out;
}

/* ---------- 同步层：XHR 封装（不假设 Promise 存在） ---------- */
var SYNC={status:"local",timer:null,retryTimer:null,lastReason:"",lastStatus:0,staticMode:false};
function isHttp(){return location.protocol==="http:"||location.protocol==="https:";}
function badgeText(st,reason){
  if(st==="synced")return "✓ 已同步";
  if(st==="syncing")return "⟳ 同步中";
  if(SYNC.staticMode)return "⚠ 本机存储（静态站点）";
  if(reason==="offline")return "⚠ 仅本地（离线文件）";
  if(reason==="timeout")return "⚠ 仅本地（请求超时）";
  if(reason==="http")return "⚠ 仅本地（HTTP "+SYNC.lastStatus+"）";
  return "⚠ 仅本地（未连服务）";
}
function setSyncStatus(st,reason){
  SYNC.status=st;
  if(reason!==undefined)SYNC.lastReason=reason;
  var el=document.getElementById("sync-badge");
  if(!el)return;
  el.className="sync-badge "+st;
  el.textContent=badgeText(st,SYNC.lastReason);
}
function httpRequest(method,url,bodyObj,timeoutMs,cb){
  if(typeof XMLHttpRequest==="undefined"){cb({ok:false,reason:"noxhr",status:0,ms:0});return;}
  var xhr=new XMLHttpRequest();
  var done=false;
  var t0=Date.now();
  var timer=setTimeout(function(){
    done=true;
    try{xhr.abort();}catch(e){}
    cb({ok:false,reason:"timeout",status:0,ms:Date.now()-t0});
  },timeoutMs||3000);
  xhr.onreadystatechange=function(){
    if(done||xhr.readyState!==4)return;
    done=true;clearTimeout(timer);
    var status=0;try{status=xhr.status||0;}catch(e){}
    var text="";try{text=xhr.responseText||"";}catch(e){}
    var ms=Date.now()-t0;
    if(status>=200&&status<300){
      var parsed=null;
      if(text){try{parsed=JSON.parse(text);}catch(e){cb({ok:false,reason:"badjson",status:status,ms:ms});return;}}
      cb({ok:true,status:status,data:parsed,ms:ms});
    }else{
      cb({ok:false,reason:"http",status:status,ms:ms});
    }
  };
  try{
    xhr.open(method,url,true);
    if(bodyObj!==null&&bodyObj!==undefined)xhr.setRequestHeader("Content-Type","application/json");
    xhr.send(bodyObj===null||bodyObj===undefined?null:JSON.stringify(bodyObj));
  }catch(e){done=true;clearTimeout(timer);cb({ok:false,reason:"send",status:0,ms:Date.now()-t0});}
}
function pickNewer(local,server){
  var ln=(local&&local.n)||0, sn=(server&&server.n)||0;
  if(sn>ln)return server;
  if(ln>sn)return local;
  var la=(local&&local.answeredAt)||"", sa=(server&&server.answeredAt)||"";
  if(sa>la)return server;
  if(la>sa)return local;
  return local;
}
function mergeAttempts(localAtt,serverAtt){
  var out={};
  Object.keys(localAtt||{}).forEach(function(k){out[k]=assign({},localAtt[k]);});
  Object.keys(serverAtt||{}).forEach(function(k){
    var s=serverAtt[k];
    if(typeof s!=="object"||!s)return;
    if(!out[k]){out[k]=assign({},s);}
    else{out[k]=pickNewer(out[k],s);}
  });
  return out;
}
function mergeChapterPass(lp,sp){
  var out={};
  Object.keys(lp||{}).forEach(function(k){out[k]=assign({},lp[k]);});
  Object.keys(sp||{}).forEach(function(k){
    var s=sp[k];
    if(typeof s!=="object"||!s)return;
    if(!out[k]){out[k]=assign({},s);}
    else{
      var L=out[k],S=s;
      if((S.date||"")>(L.date||""))out[k]=assign({},S);
      else if((S.date||"")===(L.date||"")&&(S.score||0)>(L.score||0))out[k]=assign({},S);
    }
  });
  return out;
}
function pushProgress(){
  if(!isHttp()||SYNC.staticMode)return;
  setSyncStatus("syncing");
  httpRequest("POST","/api/progress",{schema:1,attempts:state.attempts,chapterPass:state.chapterPass},3000,function(res){
    if(res.ok){setSyncStatus("synced");}
    else{applyLocalFail(res);}
  });
}
function scheduleSync(){
  if(!isHttp())return;
  if(SYNC.timer)clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(pushProgress,300);
}
function applyLocalFail(res){
  SYNC.lastStatus=res&&res.status||0;
  SYNC.staticMode=true;
  setSyncStatus("local","static");
  if(SYNC.retryTimer){clearTimeout(SYNC.retryTimer);SYNC.retryTimer=null;}
}
function scheduleHealthRetry(){
  if(SYNC.staticMode)return;
  if(!isHttp())return;
  if(SYNC.retryTimer)clearTimeout(SYNC.retryTimer);
  SYNC.retryTimer=setTimeout(healthRetry,15000);
}
function healthRetry(){
  SYNC.retryTimer=null;
  if(SYNC.staticMode)return;
  if(!isHttp())return;
  if(document.hidden){scheduleHealthRetry();return;}
  httpRequest("GET","/api/health",null,3000,function(res){
    if(res.ok){setSyncStatus("synced");bootstrapSync();}
    else{applyLocalFail(res);scheduleHealthRetry();}
  });
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)scheduleHealthRetry();});

/* ---------- 章节数据：按需加载 + localStorage LRU 缓存 ---------- */
function cacheKey(ch){return CACHE_PREFIX+ch;}
function readCache(ch){
  try{
    var raw=localStorage.getItem(cacheKey(ch));
    if(!raw)return null;
    var obj=JSON.parse(raw);
    if(!obj||!obj.knowledge||!obj.questions)return null;
    return obj;
  }catch(e){return null;}
}
function writeCache(ch,data){
  try{
    var entry={ch:ch,savedAt:new Date().toISOString(),knowledge:data.knowledge,questions:data.questions};
    var raw=JSON.stringify(entry);
    var keys=[],i,k;
    for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(k&&k.indexOf(CACHE_PREFIX)===0)keys.push(k);}
    var sizes={},total=0;
    keys.forEach(function(k){var v=localStorage.getItem(k)||"";sizes[k]=v.length;total+=v.length;});
    var cur=cacheKey(ch);
    if(sizes[cur])total-=sizes[cur];
    total+=raw.length;
    while(total>CACHE_BUDGET&&keys.length>0){
      var oldest=null,oldestTs="9999";
      keys.forEach(function(k){
        var o;try{o=JSON.parse(localStorage.getItem(k));}catch(e){o=null;}
        var ts=o&&o.savedAt||"";
        if(ts<oldestTs){oldestTs=ts;oldest=k;}
      });
      if(!oldest)break;
      localStorage.removeItem(oldest);total-=sizes[oldest]||0;
      keys.splice(keys.indexOf(oldest),1);
    }
    keys=[];
    for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(k&&k.indexOf(CACHE_PREFIX)===0)keys.push(k);}
    keys.sort(function(a,b){
      var ta,tb;
      try{ta=JSON.parse(localStorage.getItem(a)).savedAt||"";}catch(e){ta="";}
      try{tb=JSON.parse(localStorage.getItem(b)).savedAt||"";}catch(e){tb="";}
      return ta<tb?-1:(ta>tb?1:0);
    });
    while(keys.length>=CACHE_MAX){localStorage.removeItem(keys[0]);keys.shift();}
    localStorage.setItem(cur,raw);
  }catch(e){/* 配额满等异常不阻断答题 */}
}
function normalizeChapter(data){
  var knowledge={};
  var kp=data.knowledge||[];
  for(var i=0;i<kp.length;i++){knowledge[kp[i].kp_id]=kp[i];}
  return {knowledge:knowledge,questions:data.questions||[],sections:data.sections||[]};
}
function ensureChapter(ch,cb){
  if(loaded[ch]){cb(true,loaded[ch]);return;}
  var cached=readCache(ch);
  if(cached){loaded[ch]=cached;cb(true,cached);return;}
  if(!isHttp()){cb(false,null,{reason:"offline"});return;}
  httpRequest("GET","./data/ch"+pad2(ch)+".json",null,3000,function(res){
    if(res.ok&&res.data&&res.data.questions){
      var data=normalizeChapter(res.data);
      loaded[ch]=data;writeCache(ch,data);
      cb(true,data);
    }else{
      cb(false,res);
    }
  });
}

/* ---------- 章节加载中的占位 / 失败页 ---------- */
var chapterLoadingTimer=null;
function clearChapterTimer(){if(chapterLoadingTimer){clearInterval(chapterLoadingTimer);chapterLoadingTimer=null;}}
function renderChapterLoading(ch){
  var app=document.getElementById("app");
  var meta=metaOf(ch);
  app.innerHTML='<div class="card"><div class="goal">'+esc(meta?meta.name:("第 "+ch+" 章"))+'</div>'+
    '<div class="muted" id="ch-loading">正在载入本章题库…</div></div>';
  var t0=Date.now();
  clearChapterTimer();
  chapterLoadingTimer=setInterval(function(){
    var el=document.getElementById("ch-loading");
    if(!el){clearChapterTimer();return;}
    var s=Math.round((Date.now()-t0)/1000);
    el.textContent=s>=3?("网络较慢，已等待 "+s+" 秒…"):("正在载入本章题库…");
  },1000);
}
function reasonText(res){
  if(!res)return "未知错误";
  if(res.reason==="offline")return "本章未缓存，需联网首次加载";
  if(res.reason==="timeout")return "请求超时（3s）";
  if(res.reason==="http")return "HTTP "+(res.status||"?");
  if(res.reason==="badjson")return "数据格式错误（HTTP "+(res.status||"")+"）";
  if(res.reason==="noxhr")return "当前环境不支持 XHR";
  return "未连服务";
}
function renderChapterError(ch,res){
  clearChapterTimer();
  var app=document.getElementById("app");
  var meta=metaOf(ch);
  app.innerHTML='<div class="card"><div class="goal">'+esc(meta?meta.name:("第 "+ch+" 章"))+'</div>'+
    '<div class="muted" style="margin:10px 0">本章题库加载失败：'+esc(reasonText(res))+'</div>'+
    '<div class="row"><button class="btn primary" id="btn-retry-ch">重试</button>'+
    '<button class="btn ghost" id="btn-back-err">← 返回章节列表</button></div></div>';
  document.getElementById("btn-retry-ch").onclick=function(){openChapter(ch);};
  document.getElementById("btn-back-err").onclick=function(){view.screen="home";safeRender(renderHome);};
}
function openChapter(ch){
  if(isLocked(ch)){alert("本章尚未解锁：需先通关上一章。调试可勾选右上角「调试解锁」。");return;}
  view.ch=ch;view.screen="chapter";
  renderChapterLoading(ch);
  ensureChapter(ch,function(ok,data,res){
    if(ok){
      safeRender(renderChapter);
      if(view.autoStart){view.autoStart=false;startQuiz();}
    }else{renderChapterError(ch,res);}
  });
}

/* ---------- 渲染兜底 ---------- */
function safeRender(fn){
  try{fn();}catch(e){
    var msg=(e&&e.message)||String(e);
    if(window.__errBand)window.__errBand("[render] "+msg);
    var app=document.getElementById("app");
    if(app)app.innerHTML='<div class="card" style="color:#8c2f22">渲染出错：'+esc(msg)+'</div>';
  }
}

/* ---------- 渲染：首页（章列表） ---------- */
function renderHome(){
  var app=document.getElementById("app");
  var todayN=todayAnswered();
  var dueN=dueWrongAll();
  var doneArr=[],todoArr=[];
  sortedChapters().forEach(function(c){
    var s=stats(c.ch),st=chapterState(c.ch);
    var row={c:c,s:s,st:st};
    if(st==="done"||st==="review")doneArr.push(row);
    else todoArr.push(row);
  });
  var rec=null,i;
  for(i=0;i<todoArr.length;i++){if(!todoArr[i].s.pass&&r1Done(todoArr[i].c.ch)){rec=todoArr[i].c;break;}}
  if(!rec){for(i=0;i<todoArr.length;i++){if(todoArr[i].s.answered<todoArr[i].s.total){rec=todoArr[i].c;break;}}}

  var html="";
  html+='<div class="card"><div class="row"><b>今日目标 '+TODAY_GOAL+' 题</b><span class="chip">已答 '+todayN+'/'+TODAY_GOAL+'</span></div>';
  var barW=Math.min(100,Math.round(todayN/TODAY_GOAL*100));
  html+='<div class="today-bar"><i style="width:'+barW+'%"></i></div>';
  if(dueN>0){
    html+='<div class="row" style="margin:6px 0"><span>到期错题 <b>'+dueN+'</b> 题</span><button class="btn ghost" id="btn-wrong-review">先清错题</button></div>';
  }else{
    html+='<div class="row" style="margin:6px 0"><span class="muted">无到期错题</span></div>';
  }
  if(rec){
    var rs=stats(rec.ch),rst=chapterState(rec.ch);
    var r1Rec=!rs.pass&&r1Done(rec.ch);
    if(r1Rec){
      html+='<div class="row"><span>推荐：第'+rec.ch+'章 · R1 已答完，去做 R2 错题轮 / R3 通关卷</span><button class="btn primary" id="btn-continue">去通关</button></div>';
    }else{
      html+='<div class="row"><span>推荐：第'+rec.ch+'章 · 剩余 '+(rs.total-rs.answered)+' 题 · <span class="pill '+rst+'">'+STATE_LABEL[rst]+'</span></span><button class="btn primary" id="btn-continue">继续</button></div>';
    }
  }
  html+='</div>';

  html+='<div class="muted" style="font-size:13px;margin:10px 0 0">图例：青色 = R1 已完成（每题都做过，尚未通关）</div>';

function startWrongReview(){

/* ---------- 渲染：章节页 ---------- */
function renderChapter(){
  var c=metaOf(view.ch);
  var s=stats(c.ch);
  var acc=s.accuracy===null?"—":Math.round(s.accuracy*100)+"%";
  var remain;
  if(s.total===0){remain="本章暂无题目";}
  else if(s.pass){remain="已通关";}
  else{
    var gap=Math.max(0,Math.ceil(COV_DONE*s.total)-s.answered);
    remain="覆盖率 "+Math.round(s.coverage*100)+"%，R3 解锁还差 "+gap+" 题";
  }
  var wrong=wrongOf(c.ch);

  var html='<div class="row"><button class="btn ghost" id="btn-back">← 返回章节列表</button>'+
    '<h2 style="font-size:20px">'+esc(c.name)+'</h2></div>';
  if(c.goal_text)html+='<div class="goal">本章解决什么问题：'+esc(c.goal_text)+'</div>';
  html+='<div class="stats-line">'+
    '<span>总题数 <b>'+s.total+'</b></span>'+
    '<span>已答 <b>'+s.answered+'</b></span>'+
    '<span>正确率 <b>'+acc+'</b></span>'+
    '<span>错题 <b>'+s.wrong+'</b></span>'+
    '<span>状态 <b>'+STATE_LABEL[chapterState(c.ch)]+'</b></span>'+
    '<span>还差：'+esc(remain)+'</span></div>';
  var r1Secs=chapterSections(c).filter(function(x){return !x.skip;});
  var doneSecs=0;
  for(var si=0;si<r1Secs.length;si++){if(r1SecDone(c.ch,r1Secs[si].n))doneSecs++;}
  if(s.total>0&&s.answered>=s.total){
    html+='<div class="goal">本章 R1 已全部答完，可以进入 R2 / R3。</div>';
  }else{
    html+='<div class="muted" style="margin:4px 0 8px">R1 进度 '+s.answered+'/'+s.total+' 题 · 已完成 '+doneSecs+'/'+r1Secs.length+' 节</div>';
  }

  html+='<div class="modes">'+
    '<button class="mode-btn'+(view.mode==="R1"?" active":"")+'" data-mode="R1">R1 摸底（按节逐题）</button>'+
    '<button class="mode-btn'+(view.mode==="R2"?" active":"")+'" data-mode="R2">R2 错题轮</button>'+
    '<button class="mode-btn'+(view.mode==="R3"?" active":"")+'" data-mode="R3">R3 通关卷（实务优先）</button></div>';

  if(view.mode==="R1"){
    var secs=chapterSections(c);
    html+='<div class="card"><div class="sec-list">';
    if(secs.length===0){html+='<div class="empty">本章暂无题目。</div>';}
    secs.forEach(function(s){
      if(s.skip){
        html+='<div class="sec-item sec-skip"><span class="sec-name muted">'+esc(s.n)+'</span><span class="sec-count">略 · '+s.q+' 题</span></div>';
      }else{
        var ans=r1SecAnswered(c.ch,s.n);
        var total=s.q;
        var rowCls="btn sec-item"+(ans===total&&total>0?" r1-sec":"");
        var right;
        if(ans===total&&total>0){right='<span class="sec-done">✓ 已答完</span>';}
        else if(ans>0){right='<span class="sec-count">已答 '+ans+'/'+total+'</span>';}
        else{right='<span class="sec-count">'+total+' 题</span>';}
        html+='<button class="'+rowCls+'" data-sec="'+esc(s.n)+'"><span class="sec-name">'+esc(s.n)+'</span>'+right+'<span>开始 →</span></button>';
      }
    });
    html+='</div></div>';
  }else if(view.mode==="R2"){
    html+='<div class="card">';
    if(wrong.length===0){html+='<div class="empty">错题本是空的，先去 R1 或 R3 做题。</div>';}
    else{
      html+='<div class="muted" style="margin-bottom:10px">错题 '+wrong.length+' 道。连续两遍答对后移出错题本，答题记录保留。</div>'+
        '<button class="btn primary" id="btn-start">开始 R2 错题轮（'+wrong.length+' 题）</button>';
    }
    html+='</div>';
  }else{
    var qs=questionsOf(c.ch);
    var r3Size=Math.max(15,Math.ceil(s.total*0.20));
    var unlocked=state.debugUnlock||s.coverage>=COV_DONE;
    var needAns=Math.ceil(COV_DONE*s.total);
    var gapR3=Math.max(0,needAns-s.answered);
    var covPct=Math.round(s.coverage*100);
    var btn;
    if(qs.length===0){btn='<button class="btn primary" disabled>本章暂无题目</button>';}

  document.getElementById("btn-back").onclick=function(){view.screen="home";safeRender(renderHome);};

  });
  Array.prototype.forEach.call(document.querySelectorAll(".sec-item[data-sec]"),function(b){
    b.onclick=function(){view.section=b.getAttribute("data-sec");startQuiz();};
  });

  if(bs)bs.onclick=function(){startQuiz();};
}

/* ---------- 抽题 ---------- */
function buildQueue(){
  var qs=questionsOf(view.ch);
  if(view.mode==="R1"){return qs.filter(function(q){return sectionOf(q)===view.section;});}
  if(view.mode==="R2"){return qs.filter(function(q){var a=state.attempts[q.qid];return a&&a.inWrong&&!a.cleared;});}
  var prac=qs.filter(function(q){return q.card_type==="实务"||q.practical_hook;});
  var theory=qs.filter(function(q){return !(q.card_type==="实务"||q.practical_hook);});
  var size=Math.max(15,Math.ceil(qs.length*0.20));
  var p=shuffle(prac),t=shuffle(theory);
  var picked=p.slice(0,Math.min(size,p.length)).concat(t);
  return shuffle(picked.slice(0,size));
}
function startQuiz(){
  view.queue=buildQueue();
  view.idx=0;
  if(view.queue.length===0){alert("当前没有可做的题。");return;}
  view.screen="quiz";safeRender(renderQuestion);
}

  if(!judged){
    var picked={};
    Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(el){
      el.onclick=function(){

        if(multi){

function judge(q,selectedArr){
  var ans=String(q.answer||"").trim().split("").sort().join("");
  var sel=selectedArr.slice().sort().join("");
  var right=ans!==""&&sel===ans;
  record(q,right,selectedArr.join(""));
  safeRender(renderQuestion);
}
function record(q,right,given){
  var now=Date.now();
  var prev=state.attempts[q.qid];
  var entry=prev?assign({},prev):{consecRight:0,inWrong:false,rightCount:0,wrongCount:0,cleared:false};
  entry.editing=false;
  entry.verdict=right?"right":"wrong";
  entry.given=given;
  entry.answeredAt=new Date().toISOString();
  entry.lastTs=now;
  entry.n=(prev&&prev.n||0)+1;
  if(right){
    entry.rightCount=(prev&&prev.rightCount||0)+1;
    entry.wrongCount=(prev&&prev.wrongCount||0);
    entry.consecRight=(prev&&prev.consecRight||0)+1;
    var interval=SPACING[Math.min(entry.rightCount,SPACING.length)-1];
    entry.dueAt=now+interval*86400000;
    if(view.mode==="R2"&&entry.consecRight>=2){
      entry.cleared=true;entry.inWrong=false;
    }else{
      entry.cleared=!!(prev&&prev.cleared);
      entry.inWrong=!!(prev&&prev.inWrong);
    }
  }else{
    entry.wrongCount=(prev&&prev.wrongCount||0)+1;
    entry.rightCount=(prev&&prev.rightCount||0);
    entry.consecRight=0;
    entry.inWrong=true;
    entry.cleared=false;
    entry.dueAt=now+1*86400000;
  }
  state.attempts[q.qid]=entry;
  saveState();
  scheduleSync();
}

function queueResult(){
  var right=0,total=0;
  for(var i=0;i<view.queue.length;i++){
    var q=view.queue[i],a=state.attempts[q.qid];
    if(a&&(a.verdict==="right"||a.verdict==="wrong")){total++;if(a.verdict==="right")right++;}
  }
  return {right:right,total:total,accuracy:total>0?right/total:0};
}
function showSummary(){
  var s=stats(view.ch);
  var app=document.getElementById("app");
  var c=metaOf(view.ch);
  var res=queueResult();
  var r3Passed=view.mode==="R3"&&res.total>0&&res.accuracy>=PASS_ACC;
  var newlyPass=false;
  if(r3Passed&&!s.pass){
    state.chapterPass[c.ch]={date:new Date().toISOString().slice(0,10),score:Math.round(res.accuracy*100),n:view.queue.length,coverage:s.coverage};
    saveState();scheduleSync();
    newlyPass=true;
  }
  var passNow=!!(state.chapterPass&&state.chapterPass[c.ch]);
  var acc=s.accuracy===null?"—":Math.round(s.accuracy*100)+"%";
  var next=nextIncomplete(c.ch);
  var banner=passNow?"✅ 本章已通关":"🟡 尚未通关";
  var html='<div class="card summary">'+
    '<div class="progress">'+esc(c.name)+'</div>'+
    '<div class="big">'+banner+'</div>'+
    '<div class="stats-line" style="justify-content:center"><span>已答 '+s.answered+' / '+s.total+'</span><span>正确率 '+acc+'</span><span>错题 '+s.wrong+'</span></div>';
  if(newlyPass&&next){
    html+='<div class="note" style="margin-top:10px;text-align:center">第'+c.ch+'章已通关 → 下一章：第'+next.ch+'章 '+esc(next.name)+'</div>';
  }
  html+='<div class="row" style="justify-content:center;margin-top:16px">'+
    '<button class="btn" id="sm-chapter">返回章节页</button>'+
    '<button class="btn" id="sm-home">回章节列表</button>';
  if(newlyPass&&next){html+='<button class="btn primary" id="sm-next">继续下一章</button>';}
  html+='</div></div>';
  app.innerHTML=html;
  document.getElementById("sm-chapter").onclick=function(){view.screen="chapter";renderChapter();};
  document.getElementById("sm-home").onclick=function(){view.screen="home";safeRender(renderHome);};
  var nxt=document.getElementById("sm-next");
  if(nxt)nxt.onclick=function(){openChapter(next.ch);};
}

/* ---------- 导入 / 导出 ---------- */
function downloadBackup(att,cp){
  var merged=mergeAttempts(state.attempts,att||{});
  var mergedPass=mergeChapterPass(state.chapterPass,cp||{});
  var data={app:"cpa-quiz",version:3,exportedAt:new Date().toISOString(),state:assign({},state,{attempts:merged,chapterPass:mergedPass})};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="刷题进度备份_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function exportState(){
  if(!SYNC.staticMode&&isHttp()){
    setSyncStatus("syncing");
    httpRequest("GET","/api/progress",null,3000,function(res){
      if(res.ok){setSyncStatus("synced");downloadBackup(res.data&&res.data.attempts,res.data&&res.data.chapterPass);}
      else{applyLocalFail(res);downloadBackup({});}
    });
  }else{
    downloadBackup({});
  }
}
function importState(file){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      var st=data.state||data;
      if(!st||typeof st.attempts!=="object")throw new Error("格式不符：缺少 attempts");
      var imported=migrateAttempts(st.attempts);
      state.attempts=mergeAttempts(state.attempts,imported);
      if(typeof st.chapterPass==="object"&&st.chapterPass){state.chapterPass=mergeChapterPass(state.chapterPass,st.chapterPass);}
      if(typeof st.debugUnlock==="boolean")state.debugUnlock=st.debugUnlock;
      if(st.mode)state.mode=st.mode;
      state.debugUnlock=!!state.debugUnlock;
      saveState();
      document.getElementById("debug-unlock").checked=state.debugUnlock;
      alert("进度已合并：当前共 "+Object.keys(state.attempts).length+" 条答题记录。");
      safeRender(renderHome);
      scheduleSync();
    }catch(e){alert("导入失败："+e.message);}
  };
  reader.readAsText(file,"utf-8");
}

/* ---------- 诊断面板（?diag=1） ---------- */
function finishDiag(lines){
  var lsKeys=0,lsBytes=0,i,k;
  for(i=0;i<localStorage.length;i++){k=localStorage.key(i);lsKeys++;lsBytes+=(localStorage.getItem(k)||"").length;}
  lines.push("localStorage 键数="+lsKeys+" 体积="+lsBytes+" 字符");
  lines.push("DATA.chapters="+(window.DATA&&window.DATA.chapters?window.DATA.chapters.length:"-"));
  lines.push("DATA.questions="+(window.DATA&&window.DATA.questions?window.DATA.questions.length:"-"));
  lines.push("DATA.knowledge="+(window.DATA&&window.DATA.knowledge?Object.keys(window.DATA.knowledge).length:"-"));
  lines.push("dataVersion="+(window.INDEX&&window.INDEX.dataVersion||(window.DATA&&window.DATA.dataVersion)||"-"));
  lines.push("UA="+navigator.userAgent);
  lines.push("textarea="+document.querySelectorAll("textarea").length);
  lines.push("script="+document.querySelectorAll("script").length);
  var panel=document.createElement("div");
  panel.className="diag-panel";
  panel.textContent="诊断面板（长按可复制）\n"+lines.join("\n");
  document.body.appendChild(panel);
}
function buildDiag(){
  if(location.search.indexOf("diag=1")<0)return;
  var lines=[];
  lines.push("origin="+location.origin);
  lines.push("protocol="+location.protocol);
  if(SYNC.staticMode){lines.push("后端接口：静态站点无后端，进度仅存本机");finishDiag(lines);return;}
  httpRequest("GET","/api/health",null,3000,function(res){
    lines.push("/api/health="+res.status+(res.ms!=null?(" ("+res.ms+"ms)"):""));
    httpRequest("GET","/api/progress",null,3000,function(r2){
      lines.push("/api/progress="+r2.status);
      finishDiag(lines);
    });
  });
}

/* ---------- 启动即合并（仅 http/https；file:// 直接走本地） ---------- */
function bootstrapSync(){
  if(!isHttp()){setSyncStatus("local","offline");return;}
  setSyncStatus("syncing");
  httpRequest("GET","/api/progress",null,3000,function(res){
    if(res.ok&&res.data){
      if(res.data.attempts){state.attempts=migrateAttempts(mergeAttempts(state.attempts,res.data.attempts));}
      if(res.data.chapterPass){state.chapterPass=mergeChapterPass(state.chapterPass,res.data.chapterPass);}
      saveState();
      setSyncStatus("synced");
      rerenderCurrent();
    }else if(res.ok){
      setSyncStatus("synced");
    }else{
      applyLocalFail(res);
    }
  });
}
function rerenderCurrent(){
  if(view.screen==="home")safeRender(renderHome);
  else if(view.screen==="chapter")safeRender(renderChapter);
  else if(view.screen==="quiz")safeRender(renderQuestion);
}

/* ---------- 静态站点：Service Worker 与全量预缓存 ---------- */
var PRECACHE={running:false,done:0,total:0};
function registerSW(){
  if(typeof navigator==="undefined"||!("serviceWorker" in navigator)){return Promise.reject(new Error("sw-unavailable"));}
  if(navigator.serviceWorker.controller){return Promise.resolve({active:navigator.serviceWorker.controller});}
  return navigator.serviceWorker.register("./sw.js").then(function(reg){return reg.ready;});
}
function swPrecacheAll(reg,chapters,onProgress){
  return new Promise(function(resolve,reject){
    var sw=reg&&reg.active||(navigator.serviceWorker&&navigator.serviceWorker.controller);
    if(!sw){reject(new Error("no-controller"));return;}
    var done=false;
    var timer=setTimeout(function(){if(!done){done=true;reject(new Error("sw-precache-timeout"));}},180000);
    function onMsg(ev){
      var msg=ev.data||{};
      if(msg.type==="precache-progress"){onProgress(msg.done,msg.total);}
      else if(msg.type==="precache-done"){
        clearTimeout(timer);done=true;
        navigator.serviceWorker.removeEventListener("message",onMsg);
        onProgress(msg.done,msg.total);resolve();
      }
    }
    navigator.serviceWorker.addEventListener("message",onMsg);
    sw.postMessage({type:"precache-all",chapters:chapters});
  });
}
function lsPrecacheAll(chapters,onProgress){
  var chain=Promise.resolve();
  chapters.forEach(function(ch,idx){
    chain=chain.then(function(){
      return fetch("./data/ch"+pad2(ch)+".json").then(function(r){
        if(!r.ok)throw new Error("HTTP "+r.status);
        return r.json();
      }).then(function(data){
        var norm=normalizeChapter(data);
        loaded[ch]=norm;writeCache(ch,norm);
        onProgress(idx+1,chapters.length);
      }).catch(function(){onProgress(idx+1,chapters.length);});
    });
  });
  return chain;
}
function precacheAll(){
  if(PRECACHE.running){alert("正在缓存全部章节，请稍候…");return;}
  var btn=document.getElementById("btn-precache");
  var chapters=(window.DATA.chapters||[]).map(function(c){return c.ch;});
  if(!chapters.length){alert("目录为空，无法缓存。");return;}
  PRECACHE.running=true;PRECACHE.done=0;PRECACHE.total=chapters.length;
  function tick(done){if(btn)btn.textContent="缓存中 "+done+"/"+PRECACHE.total;}
  tick(0);
  registerSW().then(function(reg){
    return swPrecacheAll(reg,chapters,function(d){PRECACHE.done=d;tick(d);});
  }).catch(function(){
    return lsPrecacheAll(chapters,function(d){PRECACHE.done=d;tick(d);});
  }).then(function(){
    PRECACHE.running=false;
    if(btn)btn.textContent="已可离线使用";
    alert("已可离线使用：全部章节已尽量缓存到本机。");
  }).catch(function(e){
    PRECACHE.running=false;
    if(btn)btn.textContent="缓存失败";
    alert("缓存未完成："+((e&&e.message)||e));
  });
}
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}

/* ---------- 事件绑定 / 初始化 ---------- */
document.getElementById("btn-export").onclick=exportState;
var btnPre=document.getElementById("btn-precache");
if(btnPre)btnPre.onclick=precacheAll;
document.getElementById("btn-import").onclick=function(){document.getElementById("import-file").click();};
document.getElementById("import-file").addEventListener("change",function(e){
  if(e.target.files[0])importState(e.target.files[0]);
  e.target.value="";
});
var menuBtn=document.getElementById("btn-menu");
var menu=document.getElementById("header-menu");
if(menuBtn)menuBtn.onclick=function(ev){ev.stopPropagation();menu.classList.toggle("open");};
document.addEventListener("click",function(ev){
  if(menu&&menu.classList.contains("open")&&!menu.contains(ev.target))menu.classList.remove("open");
});

initData();
var dbg=document.getElementById("debug-unlock");
dbg.checked=state.debugUnlock;
dbg.onchange=function(){state.debugUnlock=dbg.checked;saveState();};
if(state.mode)view.mode=state.mode;
bootstrapSync();
safeRender(renderHome);
buildDiag();
})();
